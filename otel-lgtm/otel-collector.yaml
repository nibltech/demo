receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: [ "127.0.0.1:8888" ]

  filelog/msr:
    include: [ /etc/msr-logs/server.log ]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<timefield>[^\[]+)\[(?P<component>[\w\W]+)\.(?P<facility>[\w]+)\.(?P<errorNumber>[\w]+)(?P<sev>[\w])\]\s*(?:\(tid=(?P<threadId>[^\)]+)\))?\s*(?P<msg>(?:\[\s*traceId=(?P<traceId>\w+)\s*spanId=(?P<spanId>\w+))?.*)$'
        timestamp:
          parse_from: attributes.timefield
          layout: '%Y-%m-%d %H:%M:%S %Z '
          #location: America/New_York
        severity:
          parse_from: attributes.sev
          mapping:
            error4: C
            error: E
            info: I
            debug: D
            trace: T
            warn: W
            fatal: F
      - type: trace_parser
        trace_id:
          parse_from: attributes.traceId
        span_id:
          parse_from: attributes.spanId
      - type: remove
        field: attributes.timefield
      - type: remove
        field: attributes.sev
      - type: remove
        field: attributes.spanId
      - type: move
        from: attributes.msg
        to: body
      - type: add
        field: attributes.source
        value: msr
    resource:
      service.name: "msr"

  filelog/apig:
    include: [ /etc/apig-logs/server.log ]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<timefield>[^\[]+)\[(?P<component>[\w\W]+)\.(?P<facility>[\w]+)\.(?P<errorNumber>[\w]+)(?P<sev>[\w])\]\s*(?:\(tid=(?P<threadId>[^\)]+)\))?\s*(?P<msg>(?:\[\s*traceId=(?P<traceId>\w+)\s*spanId=(?P<spanId>\w+))?.*)$'
        timestamp:
          parse_from: attributes.timefield
          layout: '%Y-%m-%d %H:%M:%S %Z '
          location: America/New_York
        severity:
          parse_from: attributes.sev
          mapping:
            error4: C
            error: E
            info: I
            debug: D
            trace: T
            warn: W
            fatal: F
      - type: trace_parser
        trace_id:
          parse_from: attributes.traceId
        span_id:
          parse_from: attributes.spanId
      - type: remove
        field: attributes.timefield
      - type: remove
        field: attributes.sev
      - type: remove
        field: attributes.spanId
      - type: move
        from: attributes.msg
        to: body
      - type: add
        field: attributes.source
        value: apig
    resource:
      service.name: "apig"

exporters:
#    prometheus:
#      endpoint: "otel-collector:9091"
  otlphttp/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
#    otlp/tempo:
#      endpoint: tempo:4317
#      tls:
#        insecure: true
  otlphttp/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true

  #
  #  loki:
  #    endpoint: "http://loki:3100/loki/api/v1/push"
  #    tls:
  #      insecure: true
  otlphttp/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true

  otlp/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

  debug/metrics:
    verbosity: detailed

  debug/traces:
    verbosity: detailed

  debug/logs:
    verbosity: detailed

  file/traces:
    path: /etc/logs/otlpTraces.json

  file/metrics:
    path: /etc/logs/otlpMetrics.json

  file/logs:
    path: /etc/logs/otlpLogs.json

processors:
  batch:
    timeout: 10s
  attributes:
    actions:
      - action: insert
        key: loki.attribute.labels
        value: log.file.name, source, facility, threadId, component, errorNumber, traceId
  resource:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: source

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"
  pprof:
  zpages:

connectors:
  spanmetrics:
  servicegraph:
    latency_histogram_buckets: [ 100ms, 250ms, 1s, 5s, 10s ]
    #dimensions:
      #- dimension-1
      #- dimension-2
    store:
      ttl: 1s
      max_items: 20

service:
  extensions: [ pprof, zpages, health_check ]
  telemetry:
    logs:
      level: "debug"
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, #datadog/exporter,
        otlphttp/traces, spanmetrics, servicegraph]
      #exporters: [file/traces, datadog/exporter, otlphttp/traces, spanmetrics, servicegraph, debug/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics, #datadog/exporter,
        otlphttp/metrics]
      #exporters: [file/metrics, datadog/exporter, otlphttp/metrics, debug/metrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [file/metrics, #datadog/exporter,
        otlphttp/metrics]
#      #exporters: [file/metrics, datadog/exporter, otlphttp/metrics, debug/metrics]
    metrics/spanservicegraph:
      receivers: [servicegraph]
      processors: [batch]
      exporters: [file/metrics, #datadog/exporter,
        otlphttp/metrics]
#      #exporters: [file/metrics, datadog/exporter, otlphttp/metrics, debug/metrics]
    logs/msr:
      receivers: [filelog/msr]
      processors: [batch, resource, attributes]
      exporters: [file/logs, #datadog/exporter,
        otlphttp/logs]
#      #exporters: [file/logs, datadog/exporter, otlphttp/logs, debug/logs]
    logs/apig:
      receivers: [filelog/apig]
      processors: [batch, resource, attributes]
      exporters: [file/logs, #datadog/exporter,
        otlphttp/logs]
#      #exporters: [file/logs, datadog/exporter, otlphttp/logs, debug/logs]
    logs:
      receivers: [otlp]
      processors: [batch, resource, attributes]
      exporters: [file/logs, #datadog/exporter,
        otlphttp/logs]
#      #exporters: [file/logs, datadog/exporter, otlphttp/logs, debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp/profiles]