{
  "attachCpuInfoToAllSpans": true,
  "batchLogWrites": false,
  "captureHandlerInputs": false,
  "emitMetrics": true,
  "endpoints": {
    "traces": {
      "url": "http://otel-lgtm:4317"
    }
  },
  "includeFlowElements": false,
  "includeServerComponents": false,
  "injectTraceInfoInLogs": true,
  "serviceName": "apig",
  "nodeAttributeProviders": [
    {
      "nodeName": "pub.client:http",
      "provider": "nibble.samples.attributes:httpAttributesMapper",
      "calledAt": "end"
    }
  ],
  "logging": {
    "logFilePattern": "./logs/otelscope.log",
    "logFileCount": 3,
    "logFileMaxSize": "10MB",
    "logLevel": "WARN",
    "consoleLogEnabled": true,
    "fileLogEnabled": true,
    "consoleLogLevel": "WARN",
    "fileLogLevel": "TRACE",
    "logIdentifier": "OTELSCOPE"
  }
}